[pytest]
minversion = 6.0
; addopts = --cov=sorcererdb --cov-report=html --cov-report=xml --cov-report=term
; addopts = -ra -q --ignore=tests/legacy
addopts = --ignore=tests/legacy
testpaths = tests
markers =
    legacy: tests for v0.1.0a2 behavior; excluded by default
    integration: marks tests as hitting a real database
    unit: marks tests as unit tests (no database)
    slow: marks tests as slow running
    smoke: small, fast sanity checks
filterwarnings =
    error
    ignore::DeprecationWarning
    error::ResourceWarning